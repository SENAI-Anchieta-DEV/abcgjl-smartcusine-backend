spring.application.name=smartcusine

spring.jpa.open-in-view=false

# ===============================
# = CONFIGURAÇÕES DE UPLOAD (Multipart) =
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# = CONFIGURAÇÃO DE STORAGE =
# ===============================

#app.storage.provider=${APP_STORAGE_PROVIDER:${STORAGE_TYPE:local}}
#app.storage.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
#app.storage.local.base-path=${APP_STORAGE_LOCAL_BASE_PATH:uploads}
#app.storage.local.public-path=${APP_STORAGE_LOCAL_PUBLIC_PATH:/uploads}
#app.storage.firebase.bucket=${APP_STORAGE_FIREBASE_BUCKET:}
#app.storage.firebase.project-id=${APP_STORAGE_FIREBASE_PROJECT_ID:}
#app.storage.firebase.credentials-file=${APP_STORAGE_FIREBASE_CREDENTIALS_FILE:}
#app.storage.firebase.credentials-base64=${APP_STORAGE_FIREBASE_CREDENTIALS_BASE64:}
#app.storage.firebase.credentials-json=${APP_STORAGE_FIREBASE_CREDENTIALS_JSON:}
#app.storage.firebase.folder=${APP_STORAGE_FIREBASE_FOLDER:uploads}

# ===============================
# = CONFIGURAÇÃO JWT =
# ===============================
security.jwt.secret=${SECURITY_JWT_SECRET:mysupersecretkeymysupersecretkey123!}
security.jwt.access-expiration=${SECURITY_JWT_ACCESS_EXPIRATION:900}
security.jwt.refresh-expiration=${SECURITY_JWT_REFRESH_EXPIRATION:604800}

# ===============================
# = CORS =
# ===============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# = BOOTSTRAP DO PRIMEIRO ADMIN =
# ===============================
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@senai.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}

# ===============================
# = FLYWAY E JPA =
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

server.address=0.0.0.0
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.forward-headers-strategy=framework
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true


# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
